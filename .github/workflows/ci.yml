name: SatCrop CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Backend Testing & Validation
  backend-ci:
    name: Backend Test Suite (Python 3.12 + FastAPI)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install httpx email-validator pytest-cov

    - name: Run Backend Pytest Suite
      run: |
        cd backend
        python -m pytest tests --doctest-modules --junitxml=junit/test-results.xml --cov=app --cov-report=xml

  # Frontend Build & Typecheck
  frontend-ci:
    name: Frontend Build & Typecheck (Node.js + React + Vite)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Typecheck and Build Frontend
      run: |
        cd frontend
        npm run build

  # Full-Stack Docker Container Build Check
  docker-build:
    name: Docker Container Build Check
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: satcrop:latest
